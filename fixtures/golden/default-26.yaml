preset_keys:
  Keyboard_default:
    label: 返回
    select: .default
    send: Eisu_toggle
  Keyboard_main:
    label: ABC
    select: qwerty26
    send: Eisu_toggle
  Keyboard_number:
    label: 数字
    select: number
    send: Eisu_toggle
  Keyboard_qwerty26:
    label: 26 键
    select: qwerty26
    send: Eisu_toggle
  Keyboard_symbols:
    label: 符号
    select: symbols
    send: Eisu_toggle
  Return1:
    label: 回车
    send: Return
  liquid_keyboard_clipboard:
    command: liquid_keyboard
    label: 剪贴
    option: clipboard
    send: FUNCTION
  liquid_keyboard_emoji:
    command: liquid_keyboard
    label: 表情
    option: emoji
    send: FUNCTION
  liquid_keyboard_exit:
    command: liquid_keyboard
    label: 返回
    option: "-1"
    send: FUNCTION
  liquid_keyboard_history:
    command: liquid_keyboard
    label: 历史
    option: history
    send: FUNCTION
  liquid_keyboard_kaomoji:
    command: liquid_keyboard
    label: 颜文字
    option: kaomoji
    send: FUNCTION
  liquid_keyboard_symbols:
    command: liquid_keyboard
    label: 符号
    option: symbols
    send: FUNCTION
  macro_copy:
    text: "{Control+c}"
  macro_cut:
    text: "{Control+x}"
  macro_pair_brace:
    text: "{}{Left}"
  macro_pair_bracket:
    text: "[]{Left}"
  macro_pair_paren:
    text: (){Left}
  macro_paste:
    text: "{Control+v}"
  macro_select_all:
    text: "{Control+a}"
  space1:
    functional: false
    label: 空格
    repeatable: false
    send: space
style:
  candidate_text_size: 18
  candidate_view_height: 44
  comment_text_size: 12
  horizontal_gap: 2
  key_height: 52
  key_long_text_size: 14
  key_text_size: 22
  key_width: 10
  keyboard_height: 270
  keyboards:
    - qwerty26
    - number
    - symbols
    - default
  popup_bottom_margin: 8
  popup_height: 56
  popup_key_height: 48
  popup_text_size: 22
  popup_width: 44
  vertical_gap: 3
tool_bar:
  back_style: ic@arrow-left
  button_spacing: 6
  buttons:
    - action: liquid_keyboard_emoji
      foreground:
        style: ic@emoticon
      size:
        - 44
        - 44
    - action: liquid_keyboard_kaomoji
      foreground:
        style: ic@emoticon
      size:
        - 44
        - 44
    - action: liquid_keyboard_clipboard
      foreground:
        style: ic@clipboard
      size:
        - 44
        - 44
    - action: VOICE_ASSIST
      foreground:
        style: ic@microphone
      size:
        - 44
        - 44
    - action: Mode_switch
      foreground:
        style: ic@ascii
      size:
        - 44
        - 44
    - action: Hide
      foreground:
        style: ic@keyboard_close
      size:
        - 44
        - 44
  primary_button:
    action: menu_keyboard
    background:
      highlight: hilited_candidate_back_color
      horizontal_inset: 4
      normal: "0x00000000"
      type: circle
      vertical_inset: 4
    foreground:
      normal: candidate_text_color
      padding: 10
      style: ic@dots_horizontal
    long_press_action: Settings
    size:
      - 44
      - 44
window:
  alpha: 1
  border: 0
  corner_radius: 8
  foreground:
    comment_font_size: 14
    label_font_size: 18
    text_font_size: 20
  insets:
    horizontal: 8
    vertical: 4
  item_padding:
    horizontal: 8
    vertical: 4
  min_width: 0
  shadow: 4
